# mystorybook.site — пока нет сертификата: только HTTP, чтобы Let's Encrypt проверил домен.
# Сайт в это время не открывается (cookie книги требуют HTTPS) — это минуты до выпуска сертификата.
server {
    listen 80;
    server_name mystorybook.site www.mystorybook.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
