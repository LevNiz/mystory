# mystorybook.site — шаг 1: только HTTP (для выпуска сертификата Let's Encrypt).
# Кладётся в nginx/conf.d/ проекта wgpt_bot на сервере; общий nginx делит трафик по домену.
server {
    listen 80;
    server_name mystorybook.site www.mystorybook.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mystorybook.site$request_uri;
    }
}
