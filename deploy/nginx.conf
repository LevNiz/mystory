# mystorybook.site — полный конфиг (после выпуска сертификата).
# Кладётся в nginx/conf.d/mystorybook.conf проекта wgpt_bot на сервере.
# Весь трафик домена уходит в контейнер mystory_api по общей docker-сети;
# wassistent.online этот файл не затрагивает.

limit_req_zone $binary_remote_addr zone=mystory_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=mystory_ai:10m  rate=1r/s;

server {
    listen 80;
    server_name mystorybook.site www.mystorybook.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mystorybook.site$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.mystorybook.site;

    ssl_certificate     /etc/letsencrypt/live/mystorybook.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mystorybook.site/privkey.pem;
    include             /etc/nginx/snippets/ssl-params.conf;

    return 301 https://mystorybook.site$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mystorybook.site;

    ssl_certificate     /etc/letsencrypt/live/mystorybook.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mystorybook.site/privkey.pem;
    include             /etc/nginx/snippets/ssl-params.conf;

    client_max_body_size 4m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Заголовки безопасности (CSP и др.) ставит само приложение.
    set $mystory_upstream mystory_api;

    # Дорогие запросы к ИИ — отдельный строгий лимит на IP.
    location /api/ai/ {
        limit_req        zone=mystory_ai burst=6 nodelay;
        limit_req_status 429;
        resolver           127.0.0.11 valid=10s;
        proxy_pass         http://$mystory_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;
    }

    location /api/ {
        limit_req        zone=mystory_api burst=40 nodelay;
        limit_req_status 429;
        resolver           127.0.0.11 valid=10s;
        proxy_pass         http://$mystory_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        resolver           127.0.0.11 valid=10s;
        proxy_pass         http://$mystory_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
